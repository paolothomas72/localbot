# Host tests on Windows and Ubuntu (H1 Track P). No containers, no GPU, no models: the container
# tests need Podman or Docker under the run lock and stay a local job. Nothing here can push,
# publish or read a secret. Actions are pinned by commit SHA (a tag can be moved; H1-J J8) to their
# latest Node 24 releases (Node 20 left GitHub's runners on 2026-09-23; H1-K K3), each tag's
# commit and action.yml `runs.using` read with `gh api` and `git ls-remote` on 2026-11-01.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  host-tests:
    name: host tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    steps:
      - name: Keep LF line endings (some tests compare bytes)
        run: git config --global core.autocrlf false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip install .
      - name: The localbot command starts
        run: localbot --help
      - name: Host tests
        env:
          LOCALBOT_STATE_DIR: ${{ runner.temp }}/localbot-state
        run: python -m pytest -m "not container" -q -rs -p no:cacheprovider
